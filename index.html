<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Race: Truth or Dare</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --bg: #121212; --red: #ff4757; --green: #2ed573; --blue: #1e90ff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: white; text-align: center; overflow: hidden; }
        #game-screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.2s; cursor: pointer; }
        .waiting { background: var(--red); }
        .ready { background: var(--green); }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .card { background: #222; padding: 30px; border-radius: 20px; border: 2px solid #444; width: 85%; max-width: 400px; }
        
        button { padding: 15px 30px; margin: 10px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-truth { background: var(--blue); color: white; }
        .btn-dare { background: var(--red); color: white; }
        .btn-reset { background: #555; color: white; margin-top: 20px; }
        
        input { padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; width: 80%; max-width: 250px; color: #000; }
        #leaderboard { text-align: left; margin: 20px 0; font-size: 0.9rem; border-top: 1px solid #444; padding-top: 10px; }
    </style>
</head>
<body>

<div id="game-screen" class="waiting" onclick="handleTap()">
    <div id="init-area">
        <h1>⚡ Reaction Race</h1>
        <p>Siapa paling lambat, kena <b>Truth or Dare</b>!</p>
        <input type="text" id="p-name" placeholder="Masukkan Nama Kamu">
        <br>
        <button onclick="joinGame(event)" style="background: var(--green);">JOIN GAME</button>
    </div>
</div>

<div id="result-overlay" class="overlay">
    <div class="card">
        <h2 id="status-title">HASIL RONDE</h2>
        <div id="leaderboard"></div>
        
        <div id="decision-area" style="display:none;">
            <p id="loser-msg"></p>
            <div id="choice-buttons">
                <button class="btn-truth" onclick="choose('truth')">TRUTH</button>
                <button class="btn-dare" onclick="choose('dare')">DARE</button>
            </div>
        </div>

        <div id="final-challenge" style="display:none;">
            <h3 id="challenge-type" style="color: var(--blue);"></h3>
            <p id="challenge-text" style="font-size: 1.2rem; font-style: italic; color: #f1c40f;"></p>
            <button class="btn-reset" onclick="resetGame()">MAIN LAGI</button>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIG KAMU ---
    const firebaseConfig = {
      apiKey: "AIzaSyAT_xnQ9WImOx5IDKGZLws3B3EKW2i2JOg",
      authDomain: "mygame-f7dc3.firebaseapp.com",
      databaseURL: "https://mygame-f7dc3-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "mygame-f7dc3",
      storageBucket: "mygame-f7dc3.firebasestorage.app",
      messagingSenderId: "623658276101",
      appId: "1:623658276101:web:584bb73050b10a24c1d36c",
      measurementId: "G-41N0XYP1PK"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = "";
    let isGreen = false;
    let startTime = 0;
    let hasClicked = false;

    const dataTruth = [
        "Siapa orang yang terakhir kamu kepoin di Instagram?",
        "Apa kebohongan terbesar yang pernah kamu katakan ke orang tua?",
        "Pernahkah kamu menyukai teman yang ada di room ini?",
        "Apa hal paling memalukan yang pernah terjadi padamu di kampus?",
        "Siapa orang di sini yang menurutmu paling menyebalkan?"
    ];

    const dataDare = [
        "Chat mantan bilang 'Ternyata kamu masih yang terbaik'.",
        "Lakukan push-up 10x sambil teriak 'Aku beban kelompok!'",
        "Tunjukkan 3 foto terakhir di galerimu ke kamera.",
        "Telepon teman acak dan nyanyikan lagu 'Balonku' sampai selesai.",
        "Post story IG foto selfie muka jelek selama 5 menit."
    ];

    function joinGame(e) {
        e.stopPropagation();
        myName = document.getElementById('p-name').value.trim();
        if(!myName) return alert("Isi nama dulu, bos!");
        
        document.getElementById('init-area').innerHTML = "<h2>Menunggu pemain lain...</h2><p>Host akan memulai jika semua sudah siap.</p>";
        db.ref('tod/players/' + myName).set({ time: 9999 });
        
        // Pemain pertama yang masuk otomatis jadi Host untuk memulai game
        db.ref('tod/players').once('value', snap => {
            if(Object.keys(snap.val())[0] === myName) {
                let startBtn = document.createElement("button");
                startBtn.innerText = "MULAI GAME (HOST)";
                startBtn.onclick = (e) => { e.stopPropagation(); startRace(); };
                document.getElementById('init-area').appendChild(startBtn);
            }
        });
    }

    function startRace() {
        db.ref('tod/gameStatus').set('waiting');
        db.ref('tod/currentChallenge').set(null); // Reset tantangan lama
        let delay = Math.random() * 4000 + 2000; // Antara 2-6 detik
        setTimeout(() => {
            db.ref('tod/gameStatus').set('green');
        }, delay);
    }

    db.ref('tod/gameStatus').on('value', status => {
        const val = status.val();
        if(val === 'green') {
            isGreen = true;
            startTime = Date.now();
            document.getElementById('game-screen').className = "ready";
            document.getElementById('game-screen').innerHTML = "<h1>KLIK SEKARANG!!!</h1>";
        } else if (val === 'reset') {
            location.reload();
        }
    });

    function handleTap() {
        if(hasClicked || myName === "") return;
        hasClicked = true;
        let reaction = isGreen ? (Date.now() - startTime) : 9998; // 9998 = Curang/Terlalu cepat
        db.ref('tod/players/' + myName).update({ time: reaction });
    }

    // Pantau hasil dari semua pemain
    db.ref('tod/players').on('value', snap => {
        const players = snap.val();
        if(!players) return;
        
        const keys = Object.keys(players);
        const finished = Object.values(players).filter(p => p.time !== 9999);

        if(finished.length === keys.length && keys.length >= 2) {
            showLeaderboard(players);
        }
    });

    function showLeaderboard(players) {
        const sorted = Object.entries(players).sort((a,b) => a[1].time - b[1].time);
        const loser = sorted[sorted.length - 1];
        
        document.getElementById('result-overlay').style.display = 'flex';
        let listHtml = sorted.map((p, i) => {
            let timeTxt = p[1].time === 9998 ? "CURANG!" : p[1].time + "ms";
            return `<p>${i+1}. ${p[0]}: <b>${timeTxt}</b></p>`;
        }).join("");
        
        document.getElementById('leaderboard').innerHTML = listHtml;
        document.getElementById('decision-area').style.display = 'block';
        document.getElementById('loser-msg').innerText = `Si Lemot adalah ${loser[0]}!`;

        // Hanya si pecundang yang melihat tombol pilihan
        if(myName === loser[0]) {
            document.getElementById('choice-buttons').style.display = 'block';
        } else {
            document.getElementById('choice-buttons').innerHTML = `<p style="color:#f1c40f">Menunggu ${loser[0]} memilih nasib...</p>`;
        }
    }

    function choose(type) {
        const list = type === 'truth' ? dataTruth : dataDare;
        const challenge = list[Math.floor(Math.random() * list.length)];
        db.ref('tod/currentChallenge').set({ type: type.toUpperCase(), text: challenge });
    }

    db.ref('tod/currentChallenge').on('value', snap => {
        const data = snap.val();
        if(data) {
            document.getElementById('decision-area').style.display = 'none';
            document.getElementById('final-challenge').style.display = 'block';
            document.getElementById('challenge-type').innerText = "KONSEKUENSI " + data.type;
            document.getElementById('challenge-text').innerText = data.text;
        }
    });

    function resetGame() {
        // Hanya satu orang yang perlu reset database
        db.ref('tod').set(null).then(() => {
            db.ref('tod/gameStatus').set('reset');
        });
    }
</script>
</body>
</html>
